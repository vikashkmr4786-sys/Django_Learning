{% extends "base.html" %}
{% load static %}

{% block content %}

<!-- Large Portfolio Image -->
<section class="portfolio-hero">
    <img src="{% static 'images/portfolio.jpg' %}" alt="Portfolio Website">
</section>

<!-- Three Projects -->
<section class="projects">

    <h2>Featured Projects</h2>

    <div class="project-grid">

        <!-- Project 1 -->
        <div class="project-card">
            <img src="{% static 'images/E-commerce.jpg' %}" alt="E-commerce">
            <h3>E-commerce Store</h3>
        </div>

        <!-- Project 2 -->
        <div class="project-card">
            <img src="{% static 'images/blog.png' %}" alt="Blog">
            <h3>Blog Project</h3>
        </div>

        <!-- Project 3 -->
        <div class="project-card">
            <img src="{% static 'images/chatbot.png' %}" alt="Chat Application">
            <h3>Chat Application</h3>
        </div>

    </div>

</section>

{% endblock %}
