<!DOCTYPE html>
<html>
    <head>
        <title>My portfolio</title>
    </head>
    <body>
        <h1>Learn database in Django</h1>
        <h2>Student List</h2>
        {% if students %}
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
            </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.name}}</td>
                    <td>{{student.age}}</td>
                    <td>{{student.email}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>No student available.</p>
        {% endif %}
    </body>
</html>
